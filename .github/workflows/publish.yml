name: Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    # Least-privilege: read the repo + mint an OIDC token for npm provenance.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm test -- --coverage
      - run: npm run build
      - run: npm run release:check
      # Prefer npm Trusted Publishing (OIDC) so artifacts carry verifiable provenance.
      # NODE_AUTH_TOKEN is the fallback when trusted publishing is not yet enabled.
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
